# Alembic konfiguracija.
# Pokrece se iz korena projekta:
#   uv run alembic -c backend/alembic.ini upgrade head
#
# NAPOMENA: sqlalchemy.url se namerno NE zadaje ovde - env.py ga cita iz
# Settings (tj. iz .env), da bi vazile sigurnosne provere porta i imena baze.

[alembic]
script_location = backend/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
